name: P089 data quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent dataset audit
        run: python scripts/audit_dataset.py Catastro_Cambio_Climatico_ChileCompra.csv
      - name: Contract tests
        run: python -m unittest discover -s tests -v
      - name: Build distinct-process view
        run: python scripts/build_process_level.py Catastro_Cambio_Climatico_ChileCompra.csv --output /tmp/p089_processes.csv
